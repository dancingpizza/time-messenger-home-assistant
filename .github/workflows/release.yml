name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  runtime:
    uses: ./.github/workflows/ci.yml

  hacs:
    uses: ./.github/workflows/hacs.yml

  hassfest:
    uses: ./.github/workflows/hassfest.yml

  release:
    needs: [runtime, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify release version
        run: python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
